schema_version: 1

context:
  version: ${{ env.get('RAPIDS_PACKAGE_VERSION') | lstrip('v') }}
  py_version: ${{ env.get('CONDA_PY') }}
  py_abi_min: ${{ '.' | join([py_version[0], py_version[1:]]) }}
  cuda_version: ${{ '.'.join(environ['RAPIDS_CUDA_VERSION'] | split('.')[:2]) }}
  cuda_major: ${{ cuda_version.split('.')[0] }}
  datetime_string: ${{ env.get("RAPIDS_DATETIME_STRING") }}

package:
  name: cucim
  version: ${{ version }}

source:
  path: ../../..

build:
  number: ${{ GIT_DESCRIBE_NUMBER }}
  string: cuda${{ cuda_major }}_cp${{ py_version }}_abi3_${{ datetime_string }}_gh${{ GIT_DESCRIBE_HASH }}_gn${{ GIT_DESCRIBE_NUMBER }}_ph${{ PKG_HASH }}
  script:
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CMAKE_C_COMPILER_LAUNCHER
      - CMAKE_CUDA_COMPILER_LAUNCHER
      - CMAKE_CXX_COMPILER_LAUNCHER
      - CMAKE_GENERATOR
      - PARALLEL_LEVEL
      - SCCACHE_BUCKET
      - SCCACHE_IDLE_TIMEOUT
      - SCCACHE_REGION
      - SCCACHE_S3_USE_SSL
      - SCCACHE_S3_NO_CREDENTIALS
  python:
    version_independent: true

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler('cuda') }}
    - cuda-version =${{ cuda_version }}
    - cmake ${{ cmake_version }}
    - make
    - ninja
    - ${{ stdlib("c") }}
  host:
    - click
    - cuda-version =${{ cuda_version }}
    - cuda-cudart-dev
    - cupy >=14.0.1,!=14.1.0
    - libcucim =${{ version }}
    - nanobind >=3.1.0,<3.2.0a0
    - python ${{ py_abi_min }}.*
    - python-abi3 ${{ py_abi_min }}.*
    - python-gil
    - pip
    - rapids-build-backend >=0.4.0,<0.5.0
    - scikit-image >=0.23.2,<0.27.0
    - scipy >=1.6
    - setuptools >=80.9.0
  run:
    - ${{ pin_compatible('cuda-version', upper_bound='x', lower_bound='x') }}
    - numpy >=2.0,<3.0
    - click
    - cupy >=14.0.1,!=14.1.0
    - lazy_loader >=0.1
    - libcucim =${{ version }}
    - python
    - python-gil
    - scikit-image >=0.23.2,<0.27.0
    - scipy >=1.6
  ignore_run_exports:
    from_package:
      - ${{ compiler('cuda') }}
      - cuda-cudart-dev
  run_constraints:
    - openslide-python >=1.3.0

tests:
  requirements:
    - cuda-version =${{ cuda_version }}
  imports:
    - cucim

about:
  summary: cucim Python package
  license: Apache-2.0
  license_file:
    - LICENSE
    - LICENSE-3rdparty.md
  homepage: https://developer.nvidia.com/multidimensional-image-processing
  repository: https://github.com/rapidsai/cucim
  documentation: https://docs.nvidia.com/cucim
