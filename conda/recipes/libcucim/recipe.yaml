schema_version: 1

context:
  version: ${{ env.get('RAPIDS_PACKAGE_VERSION') | lstrip('v') }}
  cuda_version: ${{ '.'.join(environ['RAPIDS_CUDA_VERSION'] | split('.')[:2]) }}
  cuda_major: ${{ cuda_version.split('.')[0] }}
  datetime_string: ${{ env.get("RAPIDS_DATETIME_STRING") }}

package:
  name: libcucim
  version: ${{ version }}

source:
  path: ../../..

build:
  number: ${{ GIT_DESCRIBE_NUMBER }}
  string: cuda${{ cuda_major }}_${{ datetime_string }}_gh${{ GIT_DESCRIBE_HASH }}_gn${{ GIT_DESCRIBE_NUMBER }}_ph${{ PKG_HASH }}
  script:
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CMAKE_C_COMPILER_LAUNCHER
      - CMAKE_CUDA_COMPILER_LAUNCHER
      - CMAKE_CXX_COMPILER_LAUNCHER
      - CMAKE_GENERATOR
      - PARALLEL_LEVEL
      - SCCACHE_BUCKET
      - SCCACHE_IDLE_TIMEOUT
      - SCCACHE_REGION
      - SCCACHE_S3_USE_SSL
      - SCCACHE_S3_NO_CREDENTIALS

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler('cuda') }}
    - cuda-version =${{ cuda_version }}
    - binutils
    - cmake ${{ cmake_version }}
    - make
    - ninja
    - ${{ stdlib("c") }}
    - if: x86_64
      then: yasm
  host:
    - cuda-version =${{ cuda_version }}
    - cuda-cudart-dev
    - libcufile-dev
    - libnvjpeg-dev
    - libnvimgcodec-dev ${{ nvimgcodec_version }}
    - nvtx-c >=3.1.0
    - openslide
  run:
    - ${{ pin_compatible('cuda-version', lower_bound='12.2', upper_bound='13.0a0') }}
    - ${{ pin_compatible('cuda-version', upper_bound='x', lower_bound='x') }}
    - libcufile
    - libnvjpeg
    - libnvimgcodec ${{ nvimgcodec_version }}
  ignore_run_exports:
    by_name:
      - openslide
    from_package:
      - ${{ compiler('cuda') }}
      - cuda-cudart-dev
      - libcufile-dev
      - libnvjpeg-dev
      - libnvimgcodec-dev
  run_constraints:
    - ${{ pin_compatible('openslide') }}
    - libnvimgcodec-dev ${{ nvimgcodec_version }}

about:
  summary: libcucim C++ library
  license: Apache-2.0
  license_file:
    - LICENSE
    - LICENSE-3rdparty.md
  homepage: https://developer.nvidia.com/multidimensional-image-processing
  repository: https://github.com/rapidsai/cucim
  documentation: https://docs.nvidia.com/cucim
